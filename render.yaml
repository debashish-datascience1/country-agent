services:
  - type: web
    name: country-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # you paste the value manually in Render dashboard
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: LOG_LEVEL
        value: INFO
